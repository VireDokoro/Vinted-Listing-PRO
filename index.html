<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vinted Listing PRO</title>
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%2309090b'/%3E%3Ctext x='50%25' y='54%25' font-family='-apple-system, BlinkMacSystemFont, sans-serif' font-size='210' font-weight='600' fill='%23ffffff' text-anchor='middle' dominant-baseline='middle'%3EVP%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #09090b;
            --card: #18181b;
            --border: #27272a;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #ffffff;
            --accent-hover: #e4e4e7;
            --accent-text: #09090b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 50px;
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .badge {
            font-size: 0.7rem;
            background: var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input, select, textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .form-group {
            flex: 1;
        }
        .tone-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        .tone-btn {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        .tone-btn.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }
        .btn {
            width: 100%;
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }
        .btn:active {
            background: var(--accent-hover);
        }
        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            margin-top: 8px;
        }
        .output-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
            color: #d4d4d8;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 8px;
        }
        .calc-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
        }
        .calc-label {
            font-size: 0.65rem;
            color: var(--text-muted);
        }
        .calc-value {
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Vinted Listing PRO</h1>
        <span class="badge">VP v2.0</span>
    </header>

    <div class="card">
        <div class="card-title">1. Datos de la prenda</div>
        <div class="row">
            <div class="form-group">
                <label>Prenda</label>
                <input type="text" id="item" placeholder="Ej: Sudadera Nike vintage">
            </div>
            <div class="form-group">
                <label>Marca</label>
                <input type="text" id="brand" placeholder="Ej: Nike">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>Talla</label>
                <input type="text" id="size" placeholder="Ej: M / L">
            </div>
            <div class="form-group">
                <label>Estado</label>
                <select id="condition">
                    <option value="Nuevo con etiquetas">Nuevo con etiquetas</option>
                    <option value="Muy bueno" selected>Muy bueno</option>
                    <option value="Bueno">Bueno</option>
                    <option value="Satisfactorio">Satisfactorio</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Detalles / Defectos / Medidas</label>
            <textarea id="details" placeholder="Ej: Sin apenas uso, color negro desgastado de fábrica. Sisa 58cm, Largo 70cm."></textarea>
        </div>
    </div>

    <div class="card">
        <div class="card-title">2. Tono del anuncio</div>
        <div class="tone-selector">
            <div class="tone-btn active" onclick="setTone('urban')">Directo / Urban</div>
            <div class="tone-btn" onclick="setTone('minimal')">Minimal</div>
            <div class="tone-btn" onclick="setTone('pro')">Vendedor Top</div>
        </div>
        
        <div class="form-group" style="margin-bottom: 0;">
            <label>Precio de venta (€)</label>
            <input type="number" id="price" placeholder="25" oninput="calculateOffers()">
        </div>
    </div>

    <div class="card">
        <div class="card-title">3. Vista previa del anuncio</div>
        <div class="output-box" id="outputPreview">Rellena los datos para generar el anuncio...</div>
        <button class="btn" onclick="copyText()">Copiar Anuncio Completo</button>
    </div>

    <div class="card">
        <div class="card-title">4. Calculadora de ofertas</div>
        <div class="form-group" style="margin-bottom: 6px;">
            <label>Coste de compra (opcional para márgenes)</label>
            <input type="number" id="costPrice" placeholder="0" oninput="calculateOffers()">
        </div>
        <div class="calc-grid">
            <div class="calc-item">
                <div class="calc-label">-10%</div>
                <div class="calc-value" id="off10">- €</div>
            </div>
            <div class="calc-item">
                <div class="calc-label">-15%</div>
                <div class="calc-value" id="off15">- €</div>
            </div>
            <div class="calc-item">
                <div class="calc-label">-20%</div>
                <div class="calc-value" id="off20">- €</div>
            </div>
            <div class="calc-item">
                <div class="calc-label">Beneficio</div>
                <div class="calc-value" id="netProfit">- €</div>
            </div>
        </div>
    </div>

    <button class="btn btn-secondary" onclick="saveDraft()">Guardar Borrador Local</button>

    <script>
        let currentTone = 'urban';

        function setTone(tone) {
            currentTone = tone;
            document.querySelectorAll('.tone-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            generateListing();
        }

        function generateListing() {
            const item = document.getElementById('item').value.trim();
            const brand = document.getElementById('brand').value.trim();
            const size = document.getElementById('size').value.trim();
            const condition = document.getElementById('condition').value;
            const details = document.getElementById('details').value.trim();
            const price = document.getElementById('price').value.trim();

            if (!item && !brand) {
                document.getElementById('outputPreview').innerText = "Rellena los datos para generar el anuncio...";
                return;
            }

            let text = "";
            let tags = `#vinted #vintage #${brand.toLowerCase().replace(/\s+/g, '')} #streetwear`;

            if (currentTone === 'urban') {
                text = `🔥 ${item} (${brand})\n\n` +
                       `📏 Talla: ${size}\n` +
                       `💎 Estado: ${condition}\n` +
                       (details ? `⚡ Detalles: ${details}\n\n` : `\n`) +
                       `📦 Envío rápido y bien protegido.\n` +
                       `💬 Pregúntame cualquier duda sin compromiso o tira oferta seria.\n\n` +
                       tags;
            } else if (currentTone === 'minimal') {
                text = `${item} -${brand}\n` +
                       `Talla ${size} \vert{}${condition}\n` +
                       (details ? `${details}\n\n` : `\n`) +
                       `Envío inmediato. ✌️\n\n` +
                       tags;
            } else {
                text = `✨ ${item} de la marca${brand}.\n\n` +
                       `• Talla: ${size}\n` +
                       `• Estado: ${condition}\n` +
                       (details + `\n\n` : ``) +
                       `Cualquier duda escríbeme. ¡Echa un vistazo a mi perfil para hacer packs y ahorrar en envíos!\n\n` +
                       tags;
            }

            document.getElementById('outputPreview').innerText = text;
        }

        document.querySelectorAll('input, textarea, select').forEach(el => {
            el.addEventListener('input', generateListing);
        });

        function copyText() {
            const text = document.getElementById('outputPreview').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn');
                const originalText = btn.innerText;
                btn.innerText = "¡Copiado al portapapeles! ✅";
                setTimeout(() => btn.innerText = originalText, 2000);
            });
        }

        function calculateOffers() {
            const price = parseFloat(document.getElementById('price').value) || 0;
            const cost = parseFloat(document.getElementById('costPrice').value) || 0;

            if (price > 0) {
                document.getElementById('off10').innerText = (price * 0.9).toFixed(2) + '€';
                document.getElementById('off15').innerText = (price * 0.85).toFixed(2) + '€';
                document.getElementById('off20').innerText = (price * 0.8).toFixed(2) + '€';
                
                const profit = price - cost;
                document.getElementById('netProfit').innerText = profit.toFixed(2) + '€';
                document.getElementById('netProfit').style.color = profit >= 0 ? '#4ade80' : '#f87171';
            } else {
                document.getElementById('off10').innerText = '- €';
                document.getElementById('off15').innerText = '- €';
                document.getElementById('off20').innerText = '- €';
                document.getElementById('netProfit').innerText = '- €';
            }
        }

        function saveDraft() {
            const data = {
                item: document.getElementById('item').value,
                brand: document.getElementById('brand').value,
                size: document.getElementById('size').value,
                condition: document.getElementById('condition').value,
                details: document.getElementById('details').value,
                price: document.getElementById('price').value
            };
            localStorage.setItem('vinted_draft', JSON.stringify(data));
            alert('¡Borrador guardado localmente!');
        }

        window.onload = function() {
            const saved = localStorage.getItem('vinted_draft');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('item').value = data.item || '';
                document.getElementById('brand').value = data.brand || '';
                document.getElementById('size').value = data.size || '';
                document.getElementById('condition').value = data.condition || 'Muy bueno';
                document.getElementById('details').value = data.details || '';
                document.getElementById('price').value = data.price || '';
                generateListing();
                calculateOffers();
            }
        }
    </script>
</body>
</html>
